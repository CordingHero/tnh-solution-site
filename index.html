<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티엔에이치솔루션 · TNH Solution</title>
  <meta name="description" content="티엔에이치솔루션(TNH Solution)은 모바일 앱을 개발합니다.">
  <style>
    :root {
      --bg: #f7f8fa; --card: #ffffff; --text: #1a1d23; --muted: #5b6270;
      --accent: #2457d6; --line: #e3e6ec;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111318; --card: #1a1d24; --text: #eef0f4; --muted: #a3aab8; --accent: #7fa2ff; --line: #2a2e38; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.6; word-break: keep-all;
    }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 20px; }
    .card {
      width: 100%; max-width: 560px; background: var(--card);
      border: 1px solid var(--line); border-radius: 16px; padding: 40px 32px;
    }
    .en { margin: 0; color: var(--accent); font-weight: 600; letter-spacing: .04em; font-size: 14px; }
    h1 { margin: 6px 0 16px; font-size: 30px; }
    p { margin: 0 0 24px; color: var(--muted); font-size: 17px; }
    .contact { border-top: 1px solid var(--line); padding-top: 20px; font-size: 15px; }
    .contact span { color: var(--muted); margin-right: 8px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <p class="en">TNH Solution</p>
      <h1>티엔에이치솔루션</h1>
      <p>모바일 앱을 개발합니다.</p>
      <div class="contact"><span>문의</span><a href="mailto:contact@tnh-solution.cloud">contact@tnh-solution.cloud</a></div>
    </section>
  </main>
  <footer>© 2026 티엔에이치솔루션</footer>
</body>
</html>
